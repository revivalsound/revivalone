<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/revival-flame-mark.png" />
    <link rel="apple-touch-icon" href="/assets/revival-flame-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070405" />
    <script>
      // Apply the saved theme (or the device setting) before anything paints.
      (function () {
        try {
          var saved = localStorage.getItem('revival.theme')
          var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches
          var root = document.documentElement
          root.classList.toggle('light', light)
          root.classList.toggle('dark', !light)
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf6f4')
        } catch (error) {}
      })()
    </script>
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="The digital home for believers to pray together, gather, grow in the Word, and carry revival city by city." />
    <meta property="og:title" content="Revival One — One Movement. One Revival. One Generation." />
    <meta property="og:description" content="Pray together, gather, grow in the Word, and carry revival city by city." />
    <meta property="og:image" content="/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Revival One — One Movement. One Revival. One Generation.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Montserrat:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root { min-height: 100%; background: #070405; }
      body { margin: 0; overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
